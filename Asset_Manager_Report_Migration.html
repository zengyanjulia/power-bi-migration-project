function bench(){return '<section class="pane"><h2>Performance tuning evidence</h2><p class="paneltext">Source SQL · Local '+BENCH.engine+' demonstration · 288,000 synthetic holdings rows</p><div class="bench"><div class="evidence"><h3>Source query median</h3>'+dl([['Baseline',BENCH.before.median_ms+' ms'],['Tuned',BENCH.after.median_ms+' ms'],['Validation','All 30 daily totals and position counts match exactly']])+'</div><div class="evidence"><h3>Power BI acceptance tests</h3>'+dl([['Refresh','Pending Desktop/service measurement. Compare like-for-like refresh windows.'],['Page response','Pending target-workspace test. Capture DAX query and visual display time for identical filter actions.']])+'</div></div><details><summary>Method and execution plans</summary><p>Two warm-ups and nine timed executions per version. Same mandate and September date range. Combined change: date-range predicate on the stored ISO date and a composite mandate/date index.</p><pre>'+E(BENCH.before.plan.join('\n')+'\n→\n'+BENCH.after.plan.join('\n'))+'</pre></details></section>'}
function drawDetail(){const e=current();if(!e)return home();const p=pts(e),items=allitems(e),w=items.find(a=>a.key===state.item)||e.items[0],parent=items.find(a=>a.key===w.parent);app.innerHTML='<div class="row"><button onclick="location.hash=\'\'">← Summary</button><span class="muted">'+(M?E(e.wave)+' · '+E(e.source):'Epic details')+'</span></div><section class="pane"><div class="row"><div><div class="over">'+e.key+'</div><h2>'+E(e.title)+'</h2></div>'+badge(e.health)+'<b>'+p.d+' / '+p.t+' SP · '+(p.pc==null?'Unestimated':p.pc+'%')+'</b></div><div class="pill">'+p.u+' unestimated work items · Parent-level points only</div></section>'+phaseStrip(e.phase)+schedule(e,w)+(M?'<div class="pane"><h2>Report design &amp; dependencies</h2><div class="tech">'+dl([['Legacy report','SSRS (.rdl)'],['Target format',e.target==='Both'?'Interactive and paginated Power BI reports':e.target+' Power BI report'],['Business use',e.rationale],['SQL Server dataset',e.sqlCommand],['SSIS package',e.package],['Upstream rule',e.transform],['Acceptance test',e.formatTest]])+'</div><small>Illustrative SQL Server objects and SSIS dependencies.</small></div><div class="pane"><h2>Migration acceptance</h2><p class="paneltext">'+E(e.purpose)+'</p>'+dl([['Audience',e.audience+' · '+e.team],['Source records',e.origin],['Reconcile',e.check],['Illustrative control',e.sample],['Business sign-off',e.uat],['Mandate access test',e.access],['Refresh gate',e.refresh]])+'</div>':'')+'<section class="pane"><div class="row"><h3>'+E(e.mile)+'</h3><span>Baseline <b>Nov '+e.base+'</b>　→　Forecast <b>Nov '+e.forecast+'</b>　 '+(e.forecast-e.base)+'d drift</span></div></section>'+(M&&e.key==='MIG-101'?caseStudy(e):'')}
function route(){const e=current();if(!e)return home();state.correct=false;const pick=e.key==='AUTO-101'?allitems(e).find(x=>x.key==='AUTO-701'):allitems(e).find(x=>x.block)||e.items.find(x=>x.status!=='Done')||e.items[0];state.item=pick.key;state.open=new Set([pick.kind==='Subtask'?pick.parent:pick.key]);drawDetail();window.scrollTo(0,0)}
window.onhashchange=route;route();
